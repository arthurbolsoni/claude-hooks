# Checa o disco do servidor a cada 5 minutos; acima de 85% o Claude investiga.
description = "Disco do Postgres no servidor"
prompt = """
O disco do servidor `meu-servidor` passou de 85%. Descubra o que está ocupando espaço
(logs do Postgres, WAL, volumes Docker, dumps), diga o que pode ser removido com
segurança e o comando exato para liberar espaço. Não apague nada.
"""
cooldown = "2h"
timeout = "15m"

[trigger]
type = "command"
command = "ssh meu-servidor df -h / | tail -1"
interval = "5m"
when = "output_matches"
pattern = "(8[5-9]|9[0-9]|100)%"
# shell = ["bash", "-c"]

[claude]
cwd = "C:/projetos/meu-app"
model = "sonnet"
allowed_tools = ["Bash(ssh meu-servidor *)", "Read", "Grep"]
max_budget_usd = 2.0

[notify]
webhook = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
on = "always"
